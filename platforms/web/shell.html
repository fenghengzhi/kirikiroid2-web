<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiriKiroid2 Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas#canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #e94560;
        }

        #progress-bar {
            width: 300px;
            height: 6px;
            background: #16213e;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            border-radius: 3px;
            transition: width 0.3s;
        }

        #status {
            font-size: 14px;
            color: #888;
        }

        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 200;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-box {
            background: #16213e;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
        }

        #error-box h2 {
            color: #e94560;
            margin-bottom: 10px;
        }

        #error-box p {
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>KiriKiroid2 Web</h1>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="status">Loading...</div>
    </div>

    <div id="error-overlay">
        <div id="error-box">
            <h2>Error</h2>
            <p id="error-message"></p>
        </div>
    </div>

    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script>
        var statusElement = document.getElementById('status');
        var progressFill = document.getElementById('progress-fill');
        var loadingOverlay = document.getElementById('loading');

        var Module = {
            preRun: [],
            postRun: [function() {
                loadingOverlay.classList.add('hidden');
            }],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!text) {
                    loadingOverlay.classList.add('hidden');
                    return;
                }
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var pct = (parseInt(m[2]) / parseInt(m[4])) * 100;
                    progressFill.style.width = pct + '%';
                    statusElement.textContent = m[1].trim();
                } else {
                    statusElement.textContent = text;
                }
            },
            onAbort: function(what) {
                document.getElementById('error-message').textContent =
                    'The application has aborted. ' + what;
                document.getElementById('error-overlay').classList.add('visible');
            },
            monitorRunDependencies: function(left) {
                if (left === 0) {
                    Module.setStatus('');
                } else {
                    Module.setStatus('Preparing... (' + left + ' remaining)');
                }
            }
        };

        Module.setStatus('Downloading...');

        window.onerror = function(event) {
            Module.setStatus('Error: see console');
        };

        // Set canvas pixel buffer size once before WASM loads.
        // After SDL creates GL context, do NOT set canvas.width/height again
        // as that would reset the WebGL framebuffer.
        (function() {
            var canvas = document.getElementById('canvas');
            var container = document.getElementById('container');
            canvas.width = container.clientWidth || 1280;
            canvas.height = container.clientHeight || 720;
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
