<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiriKiroid2 Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas#canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            touch-action: none;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #e94560;
        }

        #progress-bar {
            width: 300px;
            height: 6px;
            background: #16213e;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            border-radius: 3px;
            transition: width 0.3s;
        }

        #status {
            font-size: 14px;
            color: #888;
        }

        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 200;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-box {
            background: #16213e;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
        }

        #error-box h2 {
            color: #e94560;
            margin-bottom: 10px;
        }

        #error-box p {
            color: #ccc;
            line-height: 1.6;
        }

        #file-picker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 150;
        }

        #file-picker.visible { display: flex; }

        #picker-box {
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        #picker-box h1 {
            font-size: 26px;
            color: #e94560;
            margin-bottom: 8px;
        }

        #picker-box .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        #drop-zone {
            border: 2px dashed #0f3460;
            border-radius: 12px;
            padding: 48px 24px;
            margin-bottom: 20px;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        #drop-zone.dragover {
            border-color: #e94560;
            background: rgba(233,69,96,0.08);
        }

        #drop-zone .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        #drop-zone .label {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 6px;
        }

        #drop-zone .hint {
            font-size: 13px;
            color: #666;
        }

        .picker-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .picker-buttons button {
            padding: 10px 24px;
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #e94560;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .picker-buttons button:hover {
            background: #e94560;
            color: #fff;
        }

        .picker-buttons button.primary {
            background: #e94560;
            color: #fff;
            font-weight: 600;
        }

        .picker-buttons button.primary:hover {
            background: #c73652;
        }

        .picker-divider {
            width: 100%;
            text-align: center;
            color: #555;
            font-size: 13px;
            margin: 14px 0 6px;
        }

        #picker-status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }

        #picker-progress {
            width: 100%;
            height: 6px;
            background: #16213e;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        #picker-progress.visible { display: block; }

        #picker-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            border-radius: 3px;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>KiriKiroid2 Web</h1>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="status">Loading...</div>
    </div>

    <div id="error-overlay">
        <div id="error-box">
            <h2>Error</h2>
            <p id="error-message"></p>
        </div>
    </div>

    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="file-picker">
        <div id="picker-box">
            <h1>KiriKiroid2 Web</h1>
            <p class="subtitle">Select a game file to start</p>
            <div id="drop-zone">
                <div class="icon">&#128193;</div>
                <div class="label">Drag & drop .xp3 file here</div>
                <div class="hint">or use the buttons below</div>
            </div>
            <div class="picker-buttons">
                <button id="pick-dir-api-btn" class="primary" style="display:none">Open Game Directory</button>
                <div id="picker-divider" class="picker-divider" style="display:none">or load a copy into memory</div>
                <button id="pick-file-btn">Select .xp3 File</button>
                <button id="pick-dir-btn">Upload Folder</button>
            </div>
            <div id="picker-status"></div>
            <div id="picker-progress"><div id="picker-progress-fill"></div></div>
        </div>
    </div>
    <input type="file" id="file-input" style="display:none;">
    <input type="file" id="dir-input" webkitdirectory style="display:none;">

    <script>
        var statusElement = document.getElementById('status');
        var progressFill = document.getElementById('progress-fill');
        var loadingOverlay = document.getElementById('loading');
        var filePicker = document.getElementById('file-picker');
        var pickerStatus = document.getElementById('picker-status');
        var pickerProgress = document.getElementById('picker-progress');
        var pickerProgressFill = document.getElementById('picker-progress-fill');
        var gameFileReady = false;
        var userFileDepAdded = false;
        var hasFileSystemAPI = typeof window.showDirectoryPicker === 'function';

        // --- File System Access API state ---
        var hostDirHandle = null;

        var Module = {
            preRun: [function() {
                Module.addRunDependency('user-file');
                userFileDepAdded = true;
                if (gameFileReady) {
                    Module.removeRunDependency('user-file');
                }
            }],
            postRun: [function() {
                loadingOverlay.classList.add('hidden');
            }],
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!text) {
                    loadingOverlay.classList.add('hidden');
                    if (!gameFileReady && !xp3Url) {
                        filePicker.classList.add('visible');
                    }
                    return;
                }
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var pct = (parseInt(m[2]) / parseInt(m[4])) * 100;
                    progressFill.style.width = pct + '%';
                    statusElement.textContent = m[1].trim();
                } else {
                    statusElement.textContent = text;
                }
            },
            onAbort: function(what) {
                document.getElementById('error-message').textContent =
                    'The application has aborted. ' + what;
                document.getElementById('error-overlay').classList.add('visible');
            },
            monitorRunDependencies: function(left) {
                if (left === 0) {
                    Module.setStatus('');
                } else if (!gameFileReady) {
                    Module.setStatus('Preparing engine... (' + left + ' remaining)');
                } else {
                    Module.setStatus('Starting... (' + left + ' remaining)');
                }
            }
        };

        Module.setStatus('Downloading engine...');

        window.onerror = function(event) {
            Module.setStatus('Error: see console');
        };

        (function() {
            var canvas = document.getElementById('canvas');
            var container = document.getElementById('container');
            canvas.width = container.clientWidth || 1280;
            canvas.height = container.clientHeight || 720;
        })();

        var xp3Url = new URLSearchParams(window.location.search).get('xp3');

        // Show File System API button when supported
        if (hasFileSystemAPI) {
            document.getElementById('pick-dir-api-btn').style.display = '';
            document.getElementById('picker-divider').style.display = '';
        }

        // --- Common helpers ---
        function ensureDir(path) {
            var parts = path.split('/').filter(Boolean);
            var cur = '';
            for (var i = 0; i < parts.length; i++) {
                cur += '/' + parts[i];
                try { FS.mkdir(cur); } catch(e) {}
            }
        }

        function writeFileToFS(fullPath, data) {
            var dir = fullPath.substring(0, fullPath.lastIndexOf('/'));
            if (dir) ensureDir(dir);
            FS.writeFile(fullPath, data);
        }

        function setPickerProgress(pct, text) {
            pickerProgress.classList.add('visible');
            pickerProgressFill.style.width = pct + '%';
            if (text) pickerStatus.textContent = text;
        }

        function readFileWithProgress(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                var sizeMB = (file.size / 1048576).toFixed(1);
                reader.onprogress = function(e) {
                    if (e.lengthComputable) {
                        var pct = Math.round(e.loaded / e.total * 100);
                        setPickerProgress(pct, 'Reading ' + file.name + ' (' + sizeMB + ' MB)... ' + pct + '%');
                    }
                };
                reader.onload = function(e) {
                    resolve(new Uint8Array(e.target.result));
                };
                reader.onerror = function() { reject(reader.error); };
                reader.readAsArrayBuffer(file);
            });
        }

        function startGame() {
            gameFileReady = true;
            filePicker.classList.remove('visible');
            loadingOverlay.classList.remove('hidden');
            statusElement.textContent = 'Starting game...';
            progressFill.style.width = '100%';
            if (userFileDepAdded) {
                Module.removeRunDependency('user-file');
            }
        }

        // --- Auto-load from URL parameter: ?xp3=<url> ---
        async function fetchXp3FromUrl(url) {
            loadingOverlay.classList.remove('hidden');
            statusElement.textContent = 'Downloading game data...';
            progressFill.style.width = '0%';
            try {
                var resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
                var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
                var reader = resp.body.getReader();
                var chunks = [];
                var loaded = 0;
                while (true) {
                    var r = await reader.read();
                    if (r.done) break;
                    chunks.push(r.value);
                    loaded += r.value.length;
                    if (total > 0) {
                        var pct = Math.round(loaded / total * 100);
                        progressFill.style.width = pct + '%';
                        statusElement.textContent = 'Downloading... ' + pct + '%';
                    } else {
                        statusElement.textContent = 'Downloading... ' + (loaded / 1048576).toFixed(1) + ' MB';
                    }
                }
                var data = new Uint8Array(loaded);
                var offset = 0;
                for (var i = 0; i < chunks.length; i++) {
                    data.set(chunks[i], offset);
                    offset += chunks[i].length;
                }
                statusElement.textContent = 'Writing to filesystem...';
                writeFileToFS('/data.xp3', data);
                startGame();
            } catch (err) {
                statusElement.textContent = 'Download failed: ' + err.message;
                progressFill.style.width = '0%';
                console.error('fetchXp3FromUrl error:', err);
                filePicker.classList.add('visible');
                loadingOverlay.classList.add('hidden');
            }
        }

        if (xp3Url) {
            fetchXp3FromUrl(xp3Url);
        }

        // --- File System Access API: directory picker + save sync ---
        async function enumerateDir(dirHandle, prefix) {
            var files = [];
            for await (var entry of dirHandle.values()) {
                var path = prefix + '/' + entry.name;
                if (entry.kind === 'directory') {
                    files = files.concat(await enumerateDir(entry, path));
                } else {
                    files.push({ path: path, handle: entry });
                }
            }
            return files;
        }

        async function handleDirectoryAPI() {
            try {
                hostDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            } catch (err) {
                if (err.name !== 'AbortError')
                    pickerStatus.textContent = 'Error: ' + err.message;
                return;
            }

            try {
                setPickerProgress(0, 'Scanning directory...');
                var dirPrefix = '/' + hostDirHandle.name;
                var entries = await enumerateDir(hostDirHandle, dirPrefix);
                var total = entries.length;
                if (total === 0) {
                    pickerStatus.textContent = 'Directory is empty.';
                    pickerProgress.classList.remove('visible');
                    hostDirHandle = null;
                    return;
                }

                Module._lazyFiles = {};
                Module._loadedFiles = {};
                Module._hostStreams = {};
                Module._nextStreamId = 1;
                Module._hostDirHandle = hostDirHandle;
                Module._hostDirPrefix = dirPrefix;

                for (var i = 0; i < total; i++) {
                    var entry = entries[i];
                    setPickerProgress(
                        Math.round(i / total * 100),
                        'Registering (' + (i + 1) + '/' + total + ') ' + entry.path.substring(dirPrefix.length + 1)
                    );
                    var isStream = entry.path.toLowerCase().endsWith('.xp3');
                    Module._lazyFiles[entry.path] = {
                        handle: entry.handle,
                        stream: isStream
                    };
                    var dir = entry.path.substring(0, entry.path.lastIndexOf('/'));
                    if (dir) ensureDir(dir);
                    FS.writeFile(entry.path, new Uint8Array(0));
                }

                setPickerProgress(100, 'Starting...');
                startGame();
            } catch (err) {
                pickerStatus.textContent = 'Error: ' + err.message;
                pickerProgress.classList.remove('visible');
                hostDirHandle = null;
            }
        }

        // --- Fallback: .xp3 file picker ---
        async function handleXp3File(file) {
            try {
                setPickerProgress(0, 'Reading ' + file.name + '...');
                var data = await readFileWithProgress(file);
                setPickerProgress(100, 'Writing to filesystem...');
                writeFileToFS('/data.xp3', data);
                startGame();
            } catch (err) {
                pickerStatus.textContent = 'Error: ' + err.message;
                pickerProgress.classList.remove('visible');
            }
        }

        async function handleFolder(files) {
            var total = files.length;
            try {
                if (!Module._lazyFiles) Module._lazyFiles = {};
                if (!Module._loadedFiles) Module._loadedFiles = {};
                if (!Module._hostStreams) Module._hostStreams = {};
                if (!Module._nextStreamId) Module._nextStreamId = 1;

                for (var i = 0; i < total; i++) {
                    var file = files[i];
                    var relPath = '/' + file.webkitRelativePath;
                    setPickerProgress(Math.round(i / total * 100),
                        'Registering (' + (i + 1) + '/' + total + ') ' + file.name);
                    var isStream = file.name.toLowerCase().endsWith('.xp3');
                    Module._lazyFiles[relPath] = { file: file, stream: isStream };
                    var dir = relPath.substring(0, relPath.lastIndexOf('/'));
                    if (dir) ensureDir(dir);
                    FS.writeFile(relPath, new Uint8Array(0));
                }
                startGame();
            } catch (err) {
                pickerStatus.textContent = 'Error: ' + err.message;
                pickerProgress.classList.remove('visible');
            }
        }

        // --- Button bindings ---
        document.getElementById('pick-dir-api-btn').addEventListener('click', handleDirectoryAPI);

        document.getElementById('pick-file-btn').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        document.getElementById('pick-dir-btn').addEventListener('click', function() {
            document.getElementById('dir-input').click();
        });

        document.getElementById('file-input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) handleXp3File(file);
            e.target.value = '';
        });

        document.getElementById('dir-input').addEventListener('change', function(e) {
            var files = Array.from(e.target.files);
            if (files.length > 0) handleFolder(files);
            e.target.value = '';
        });

        // Drag & drop
        var dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function() {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            var file = e.dataTransfer.files[0];
            if (file) handleXp3File(file);
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
