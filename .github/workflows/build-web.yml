name: Build Web

on:
  workflow_dispatch:
    inputs:
      upload_cloudflare_pages:
        description: Upload the Web build to Cloudflare Pages
        required: false
        type: boolean
        default: false
      cloudflare_pages_environment:
        description: Cloudflare Pages deployment environment
        required: false
        type: choice
        default: preview
        options:
          - preview
          - production

  workflow_run:
    workflows: ["Code Format Check"]
    types: ["completed"]
  push:
    branches:
      - web

env:
  EMSDK_VERSION: "4.0.23"

jobs:
  build-web:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      EMSDK: ${{ github.workspace }}/.emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ninja-build python3

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "EMSDK_NODE=$(find ${{ env.EMSDK }}/node -name node -type f | head -1)" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH
          echo "$(dirname $(find ${{ env.EMSDK }}/node -name node -type f | head -1))" >> $GITHUB_PATH

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: b1e15efef6758eaa0beb0a8732cfa66f6a68a81d

      - name: Check NuGet API key
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "HAS_NUGET_KEY=true" >> $GITHUB_ENV
          fi

      - name: Install Mono (for NuGet)
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          sudo apt-get install -y mono-complete

      - name: Add NuGet sources
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.NUGET_API_KEY }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.NUGET_API_KEY }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}

      - name: Configure CMake
        run: |
          set -o pipefail
          cmake --preset "Web Release Config" 2>&1 | tee /tmp/cmake-configure.log

      - name: Pre-build Emscripten ports
        run: |
          embuilder build sdl2 sdl2_ttf sdl2-mt sdl2_ttf-mt

      - name: Build
        run: |
          set -o pipefail
          cmake --build out/web/release 2>&1 | tee /tmp/cmake-build.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: warn
          path: |
            /tmp/cmake-configure.log
            /tmp/cmake-build.log
            out/web/release/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            out/web/release/index.html
            out/web/release/index.js
            out/web/release/index.wasm
            out/web/release/index.data
            out/web/release/index.worker.js
            out/web/release/manifest.webmanifest
            out/web/release/sw.js
            out/web/release/pwa/
            out/web/release/baidu_verify_codeva-3Z4bQwqyXI.html
            out/web/release/robots.txt
            out/web/release/sitemap.xml

      - name: Prepare Cloudflare Pages upload
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.upload_cloudflare_pages }}
        run: |
          rm -rf /tmp/cloudflare-pages
          mkdir -p /tmp/cloudflare-pages
          cp out/web/release/index.html /tmp/cloudflare-pages/
          cp out/web/release/index.js /tmp/cloudflare-pages/
          cp out/web/release/index.wasm /tmp/cloudflare-pages/
          cp out/web/release/index.data /tmp/cloudflare-pages/
          if [ -f out/web/release/index.worker.js ]; then
            cp out/web/release/index.worker.js /tmp/cloudflare-pages/
          fi
          cp out/web/release/manifest.webmanifest /tmp/cloudflare-pages/
          cp out/web/release/sw.js /tmp/cloudflare-pages/
          cp -R out/web/release/pwa /tmp/cloudflare-pages/
          cp out/web/release/baidu_verify_codeva-3Z4bQwqyXI.html /tmp/cloudflare-pages/
          cp out/web/release/robots.txt /tmp/cloudflare-pages/
          cp out/web/release/sitemap.xml /tmp/cloudflare-pages/
          cp _headers /tmp/cloudflare-pages/

      - name: Upload to Cloudflare Pages
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.upload_cloudflare_pages }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_ENVIRONMENT: ${{ inputs.cloudflare_pages_environment }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || secrets.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME variable or secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          deploy_branch="$GITHUB_REF_NAME"
          if [ "$CLOUDFLARE_PAGES_ENVIRONMENT" = "production" ]; then
            deploy_branch="$CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          fi
          echo "Uploading $CLOUDFLARE_PAGES_ENVIRONMENT deployment to Cloudflare Pages branch $deploy_branch"
          npx wrangler@latest pages deploy /tmp/cloudflare-pages \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$deploy_branch"
