name: Build Web

# 只构建引擎（wasm）。页面由 build-webui.yml 单独构建 —— 一次 emscripten
# 链接十几分钟，不该被一行 .vue 或一段文档触发。
on:
  workflow_dispatch:
  # 上游 Code Format Check 的 paths 已排除 platforms/web/webui，
  # 所以纯前端改动不会走到这里（workflow_run 本身不支持 paths 过滤）。
  workflow_run:
    workflows: ["Code Format Check"]
    types: ["completed"]
  push:
    branches:
      - web
      - 'dev/*'
    paths-ignore:
      - 'platforms/web/webui/**'
      - '.github/workflows/build-webui.yml'
      - 'analysis/**'
      - 'doc/**'
      - '**/*.md'
      # 本地调试用的静态服务器（只负责发 COOP/COEP 头），进不了 wasm
      - 'coi-server.py'

env:
  EMSDK_VERSION: "4.0.23"

jobs:
  build-web:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      EMSDK: ${{ github.workspace }}/.emsdk
      BUILD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      KRKR2_WEB_SOURCE_MAP: ${{ (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'dev/')) || (github.event_name != 'workflow_run' && startsWith(github.ref_name, 'dev/')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          lfs: true
          submodules: false

      - name: Checkout public submodules
        run: |
          git submodule update --init --recursive cpp/plugins/layerExImage

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ninja-build python3 autoconf automake libtool

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "EMSDK_NODE=$(find ${{ env.EMSDK }}/node -name node -type f | head -1)" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH
          echo "$(dirname $(find ${{ env.EMSDK }}/node -name node -type f | head -1))" >> $GITHUB_PATH

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: b1e15efef6758eaa0beb0a8732cfa66f6a68a81d

      - name: Check NuGet API key
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "HAS_NUGET_KEY=true" >> $GITHUB_ENV
          fi

      - name: Install Mono (for NuGet)
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          sudo apt-get install -y mono-complete

      - name: Add NuGet sources
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.NUGET_API_KEY }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.NUGET_API_KEY }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}

      - name: Configure CMake
        run: |
          set -o pipefail
          echo "Build branch: $BUILD_BRANCH; source map: $KRKR2_WEB_SOURCE_MAP"
          cmake --preset "Web Release Config" \
            -DKRKR2_WEB_ENABLE_SOURCE_MAP="$KRKR2_WEB_SOURCE_MAP" \
            2>&1 | tee /tmp/cmake-configure.log

      - name: Pre-build Emscripten ports
        run: |
          embuilder build sdl2 sdl2_ttf sdl2-mt sdl2_ttf-mt

      - name: Build
        run: |
          set -o pipefail
          cmake --build out/web/release 2>&1 | tee /tmp/cmake-build.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: warn
          path: |
            /tmp/cmake-configure.log
            /tmp/cmake-build.log
            out/web/release/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-engine
          # 引擎产物，仅此六项（见 CMakeLists.txt 的 WEB 分支）。
          # HTML/CSS/JS/PWA/sw.js 一概不在这里 —— 那些是 platforms/web/webui
          # 的 Vite 产物，由 build-webui.yml 上传为 webui-dist。
          # 想要能跑的整站：把本 artifact 解到某目录，然后
          # KRKR2_ENGINE_DIR=<该目录> npm run build。
          path: |
            out/web/release/index.js
            out/web/release/index.wasm
            ${{ env.KRKR2_WEB_SOURCE_MAP == 'true' && 'out/web/release/index.wasm.map' || '' }}
            out/web/release/index.worker.js
            out/web/release/build-config.js
            out/web/release/assets.zip

      # ── 两个大文件传 R2 ────────────────────────────────────────────────
      # index.wasm(21.9MiB) + assets.zip(7.8MiB) 不再随页面部署：前者已占
      # Workers 静态资源 25MiB 单文件上限的 87.5%，迟早撞墙。改由 R2 提供后
      # 部署产物从 30MB 降到约 680KB。页面侧用 KRKR2_ENGINE_BASE 指过来
      # （见 platforms/web/webui/vite.config.js 与 public/js/config.js）。
      #
      # index.js 与 build-config.js 刻意不传：glue 跨域会踩 _scriptName 定位
      # pthread worker 的坑，build-config.js 带着 initialMemory 权威值，
      # 两者都必须与页面同源。
      - name: Check R2 credentials
        if: success()
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && \
             [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "HAS_R2=true" >> $GITHUB_ENV
          else
            echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 R2 上传。"
            echo "fork 与外部 PR 拿不到 secrets，这里跳过而不是失败。"
          fi

      - name: Setup Node (for wrangler)
        if: ${{ env.HAS_R2 == 'true' }}
        uses: actions/setup-node@v4
        with:
          # wrangler 4 低于 22 直接拒绝启动
          node-version: '22'

      - name: Upload engine to R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_ENGINE_BUCKET || 'krkr2-engine' }}
        run: |
          set -euo pipefail
          # 按 commit 分目录：这两个文件名不带内容哈希，同一路径覆盖更新会让
          # 已缓存的客户端拿到新旧混搭的 glue/wasm。带版本段则换版即换 URL，
          # 可以安全地 immutable 长缓存。
          #
          # key 不含 "engine/" 前缀 —— URL 里的 /engine/ 是 Worker 的路由命名空间，
          # worker/engine.js 把 /engine/<rest> 映射到桶里的 <rest>。
          VERSION="${GITHUB_SHA:0:12}"

          put() {
            echo "→ $BUCKET/$VERSION/$1"
            # --remote 必须给：wrangler 4 的 r2 object 默认走本地模拟存储，
            # 少了它这一步会"成功"但什么都没上传。
            npx --yes wrangler@4 r2 object put "$BUCKET/$VERSION/$1" \
              --file "out/web/release/$1" \
              --content-type "$2" \
              --cache-control "public, max-age=31536000, immutable" \
              --remote
          }

          put index.wasm application/wasm
          put assets.zip application/zip

          {
            echo "### 引擎已上传 R2"
            echo ""
            echo '构建页面时设这个环境变量（同源路径，不是 R2 公开域名）：'
            echo ""
            echo '```'
            echo "KRKR2_ENGINE_BASE=/engine/$VERSION/ npm run build"
            echo '```'
            echo ""
            echo "Worker 会从 R2 绑定读出来并按同源返回（见 worker/engine.js），"
            echo "因此 R2 侧不需要公开域名，也不需要配 CORS / CORP。"
          } >> "$GITHUB_STEP_SUMMARY"

