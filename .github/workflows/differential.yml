name: Differential Tests

on:
  workflow_dispatch:
  push:
    branches: [web]

env:
  EMSDK_VERSION: "4.0.23"
  FRIDA_VERSION: "16.4.10"

jobs:
  # ── Port vs libkrkr2 value diff under wasmtime (fast, parallel-friendly).
  wasmtime:
    runs-on: ubuntu-latest
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (public + private reference)
        env:
          PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${PRIVATE_SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          git -c submodule.reference.update=checkout submodule update --init --recursive

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wasmtime
        run: pip install wasmtime

      - name: Build WASM + run port-wasm differential tests
        run: python tests/differential/run_all.py

  # ── libkrkr2 oracle via ADB harness + Frida call-sequence diff
  #    (rooted Android 7 arm64 emulator on KVM-accelerated Graviton-class
  #    ARM64 Linux; HVF is blocked by nested virt on GitHub-hosted
  #    macos-14, so we use native ARM Linux hosts instead).
  adb-frida:
    needs: wasmtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (public + private reference)
        env:
          PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${PRIVATE_SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          git -c submodule.reference.update=checkout submodule update --init --recursive

      # Give the runner user RW access to /dev/kvm so QEMU can open it.
      # The reactivecircus-recommended `udevadm trigger --name-match=kvm`
      # dance doesn't work on ubuntu-24.04-arm (KVM isn't a hot-pluggable
      # udev device on Graviton hosts); chmod it directly instead. The
      # diagnostic block first so we fail loud if /dev/kvm is missing
      # rather than silently falling back to TCG.
      - name: Enable KVM
        run: |
          set -x
          uname -a
          ls -la /dev/kvm || { echo "::error::/dev/kvm missing — no KVM on this runner" >&2; exit 1; }
          lsmod | grep -E '^kvm' || true
          sudo chmod 0666 /dev/kvm
          ls -la /dev/kvm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frida host deps
        run: pip install -r tests/differential/oracle_runner/requirements-oracle.txt

      - name: Cache frida-server binary
        uses: actions/cache@v4
        id: frida-server-cache
        with:
          path: tools/bin/android/frida-server
          key: frida-server-${{ env.FRIDA_VERSION }}-android-arm64

      - name: Download frida-server
        if: steps.frida-server-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/bin/android
          curl -L -o /tmp/frida-server.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz"
          xz -d /tmp/frida-server.xz
          mv /tmp/frida-server tools/bin/android/frida-server
          chmod 755 tools/bin/android/frida-server

      # AVD cache to skip cold-boot / image download on subsequent runs.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api24-arm64-${{ runner.os }}-${{ runner.arch }}

      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          disable-spellchecker: true
          script: echo "AVD booted; saving snapshot"

      - name: Run ADB+Frida differential oracle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -euo pipefail
            adb root
            adb wait-for-device
            adb shell "mkdir -p /data/local/tmp"
            adb push reference/libkrkr2/libkrkr2.so   /data/local/tmp/
            adb push reference/lib/libSDL2.so         /data/local/tmp/
            adb push reference/lib/libffmpeg.so       /data/local/tmp/
            adb push tests/differential/oracle_runner/harness/prebuilt/harness-aarch64 \
                     /data/local/tmp/
            adb push tools/bin/android/frida-server   /data/local/tmp/
            adb shell "chmod 755 /data/local/tmp/harness-aarch64 /data/local/tmp/frida-server"
            adb shell "nohup /data/local/tmp/frida-server -D >/dev/null 2>&1 &"
            sleep 3
            test -n "$(adb shell pidof frida-server | tr -d '[:space:]')" \
              || { echo 'frida-server did not start' >&2; exit 1; }

            # Runners exit non-zero on BOTH trace-vs-golden divergences
            # AND port-vs-libkrkr2 value divergences. The Frida job's
            # purpose is only the former — port-value divergences are
            # documented findings (see oracle_runner/README.md "Status")
            # and get addressed in the port, not here. Fail only if a
            # trace diff or missing-golden error fires.
            trace_failed=0
            for f in geometry_hit_test local_transform bezier_curve position_interp; do
              echo "::group::run_${f}_adb --trace"
              set +e
              python3 tests/differential/python/run_${f}_adb.py \
                      --spec-dir tests/differential/specs/${f} \
                      --trace \
                      > /tmp/run.${f}.stdout 2> /tmp/run.${f}.stderr
              runner_rc=$?
              set -e
              cat /tmp/run.${f}.stdout
              cat /tmp/run.${f}.stderr >&2
              if grep -qE '^TRACE (MISMATCH|MISSING)' /tmp/run.${f}.stderr; then
                echo "::error family=${f}::Frida trace regression" >&2
                trace_failed=1
              fi
              echo "::endgroup::"
              echo "${f}: runner_rc=${runner_rc}"
            done
            exit $trace_failed
