name: Differential Tests

on:
  workflow_dispatch:
  push:
    branches: [web]

env:
  EMSDK_VERSION: "4.0.23"

jobs:
  differential:
    runs-on: ubuntu-latest
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
      QILING_ROOTFS: ${{ github.workspace }}/.qiling-rootfs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (public + private reference)
        env:
          PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${PRIVATE_SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          git -c submodule.reference.update=checkout submodule update --init --recursive

      # ── Emscripten ──
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH

      # ── Python + wasmtime ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wasmtime + Qiling oracle deps
        run: |
          pip install wasmtime
          pip install -r tests/differential/oracle_runner/requirements-oracle.txt

      # ── Qiling Android ARM64 rootfs ──
      - name: Cache Qiling rootfs
        uses: actions/cache@v4
        id: qiling-rootfs-cache
        with:
          path: ${{ env.QILING_ROOTFS }}
          key: qiling-rootfs-arm64-android6-v1

      - name: Clone Qiling rootfs
        if: steps.qiling-rootfs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/qilingframework/rootfs.git \
            ${{ env.QILING_ROOTFS }}

      # ── Build standalone WASM test modules ──
      - name: Build WASM test targets
        run: |
          cd tests/differential/wasm
          PLUGIN_PATH=${{ github.workspace }}/cpp/plugins

          em++ geometry_hit_test_wasm.cpp -std=c++17 -O1 -I${PLUGIN_PATH} \
            -sSTANDALONE_WASM=1 -sEXPORTED_FUNCTIONS="['_krkr2_hit_test_run']" \
            --no-entry -o geometry_hit_test.wasm

          em++ psb_rl_decompress_wasm.cpp -std=c++17 -O1 \
            -sSTANDALONE_WASM=1 -sEXPORTED_FUNCTIONS="['_run_psb_rl_decompress','_get_compressed_ptr','_get_decompressed_ptr','_get_decompressed_size_ptr']" \
            --no-entry -o psb_rl_decompress.wasm

          em++ bezier_curve_wasm.cpp -std=c++17 -O1 \
            -sSTANDALONE_WASM=1 -sEXPORTED_FUNCTIONS="['_run_bezier_curve','_get_curve_x_ptr','_get_curve_y_ptr','_get_result_ptr']" \
            --no-entry -o bezier_curve.wasm

          em++ local_transform_wasm.cpp -std=c++17 -O1 \
            -sSTANDALONE_WASM=1 -sEXPORTED_FUNCTIONS="['_run_local_transform','_get_affine_in_ptr','_get_affine_out_ptr']" \
            --no-entry -o local_transform.wasm

          em++ position_interp_wasm.cpp -std=c++17 -O1 \
            -sSTANDALONE_WASM=1 -sEXPORTED_FUNCTIONS="['_run_position_interp','_get_easing_x_ptr','_get_easing_y_ptr','_get_cp_x_ptr','_get_cp_y_ptr','_get_cp_t_ptr','_get_cp_seg_data_ptr','_get_cp_seg_sizes_ptr','_get_src_pos_ptr','_get_dst_pos_ptr','_get_out_pos_ptr']" \
            --no-entry -o position_interp.wasm

      - name: Run differential tests
        run: |
          python tests/differential/python/run_geometry_hit_test_wasmtime.py \
            --spec-dir tests/differential/specs/geometry_hit_test \
            --wasm tests/differential/wasm/geometry_hit_test.wasm

          python tests/differential/python/run_psb_rl_decompress_wasmtime.py \
            --spec-dir tests/differential/specs/psb_rl_decompress \
            --wasm tests/differential/wasm/psb_rl_decompress.wasm

          python tests/differential/python/run_bezier_curve_wasmtime.py \
            --spec-dir tests/differential/specs/bezier_curve \
            --wasm tests/differential/wasm/bezier_curve.wasm

          python tests/differential/python/run_local_transform_wasmtime.py \
            --spec-dir tests/differential/specs/local_transform \
            --wasm tests/differential/wasm/local_transform.wasm

          python tests/differential/python/run_position_interp_wasmtime.py \
            --spec-dir tests/differential/specs/position_interp \
            --wasm tests/differential/wasm/position_interp.wasm

      # ── Qiling oracle validation (runs libkrkr2.so under emulation) ──
      - name: Run Qiling oracle tests
        env:
          KRKR2_ROOTFS: ${{ env.QILING_ROOTFS }}/arm64_android6.0
        run: |
          python tests/differential/python/run_geometry_hit_test_qiling.py \
            --spec-dir tests/differential/specs/geometry_hit_test

          python tests/differential/python/run_local_transform_qiling.py \
            --spec-dir tests/differential/specs/local_transform
