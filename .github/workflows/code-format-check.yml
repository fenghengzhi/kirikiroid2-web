name: Code Format Check

on:  
  workflow_dispatch:

  # 这个 workflow 同时是 Build Web 的上游触发器（build-web.yml 用
  # workflow_run 挂在它后面），所以 paths 实际决定"什么改动会重链 wasm"。
  # 排除项因此不只是"这里没有 C++ 文件"，更是"改它不该花十几分钟编译引擎"。
  push:
    branches: [ main ]
    paths:
      - 'cmake/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/**'
      # 前端是独立的 Vite 工程，不含 C++、也不进 wasm 链接，
      # 由 build-webui.yml 单独构建（否则改一行 .vue 就触发整轮 emscripten）
      - '!platforms/web/webui/**'
      - '!.github/workflows/build-webui.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmake/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/**'
      - '!platforms/web/webui/**'
      - '!.github/workflows/build-webui.yml'

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: 'cpp platforms'
          extensions: 'cpp,cc,h,hpp,inc'
          clangFormatVersion: 20